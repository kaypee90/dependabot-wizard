name: 'Dependabot Health Report'
description: 'Summarise how a repository is handling the pull requests Dependabot opens.'
author: 'kaypee90'

branding:
  icon: 'activity'
  color: 'blue'

inputs:
  token:
    description: 'Token with repo scope used to read pull requests.'
    required: true
    default: ${{ github.token }}
  owner:
    description: 'Repository owner. Defaults to the repository running the workflow.'
    required: false
    default: ''
  repo:
    description: 'Repository name. Defaults to the repository running the workflow.'
    required: false
    default: ''
  author:
    description: 'Pull request author to count. Dependabot pull requests are matched by author, so no label is required.'
    required: false
    default: 'app/dependabot'
  label:
    description: 'Optional extra narrowing by label. Leave blank to count every pull request by the author.'
    required: false
    default: ''

outputs:
  total:
    description: 'Total labelled pull requests found.'
  open:
    description: 'Pull requests still open.'
  merged:
    description: 'Pull requests merged.'
  closed:
    description: 'Pull requests closed without merging.'
  merge-rate:
    description: 'Merged as a percentage of resolved pull requests.'
  stale:
    description: 'Pull requests open longer than 30 days.'
  median-merge-days:
    description: 'Median days from opening to merge.'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    GITHUB_TOKEN: ${{ inputs.token }}
  args:
    - '--report'
    - '--owner'
    - ${{ inputs.owner }}
    - '--repo'
    - ${{ inputs.repo }}
    - '--author'
    - ${{ inputs.author }}
    - '--label'
    - ${{ inputs.label }}
