name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.1'

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Verify embedded assets
      run: ./scripts/verify-embedded-assets.sh

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/depbot-app
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install
      run: npm install --legacy-peer-deps --no-audit --no-fund

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Test
      run: CI=true npx react-scripts test --watchAll=false

    - name: Build
      run: npm run build

    - name: Verify the embedded build is self-consistent
      run: ../../scripts/verify-embedded-assets.sh ../../cmd/depbot/static

  action:
    name: Action image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The Marketplace action runs from this image, so a broken Dockerfile or
    # entrypoint has to fail here rather than in someone else's workflow.
    - name: Build
      run: docker build -t depbot-action:ci .

    - name: Entrypoint responds
      run: docker run --rm depbot-action:ci --version

    - name: Missing token fails cleanly
      run: |
        if docker run --rm depbot-action:ci --report --owner o --repo r; then
          echo "expected a non-zero exit without GITHUB_TOKEN"
          exit 1
        fi

  self-report:
    name: Dependabot health
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@v4

    # Dogfooding: this repository reports on its own dependabot pull requests,
    # which is also the smoke test that the action works as published.
    - name: Report
      uses: ./
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
